<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anketlerim</title>
    
    <!-- OTOMATİK OTURUM KONTROLÜ VE GİRİŞ SAYFASINA YÖNLENDİRME -->
    <script>
        const API_BASE_URL = 'https://survey-application-q4ko.onrender.com';
        
        // Sayfa yüklenir yüklenmez backend'e istek atıp oturum durumunu test et
        fetch(`${API_BASE_URL}/api/v1/surveys`, {
            method: 'GET',
            credentials: 'include'
        }).then(response => {
            // Eğer giriş yapılmamışsa (401 veya 403), direkt login sayfasına at
            if (response.status === 401 || response.status === 403) {
                window.location.replace('login.html');
            }
        }).catch(() => {
            // Sunucuya ulaşılamazsa veya hata olursa güvenli olması için login'e yönlendir
            window.location.replace('login.html');
        });
    </script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* Üst Menü (Navbar) */
        .navbar { background-color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .navbar h2 { margin: 0; color: #333; }
        .btn-primary { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary:hover { background-color: #0056b3; }

        /* Anket Listesi Kartları */
        .container { padding: 30px; max-width: 1000px; margin: 0 auto; }
        .survey-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .survey-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 5px solid #007bff; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .survey-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .survey-card h3 { margin-top: 0; color: #333; }
        .survey-card p { color: #666; font-size: 14px; }
        .empty-message { text-align: center; color: #777; font-size: 16px; margin-top: 50px; width: 100%; grid-column: 1 / -1; }

        /* Açılır Pencere (Modal) Tasarımı */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 8px; width: 400px; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #333; }
        
        /* Form Elemanları */
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px;}
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; margin-top: 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #218838; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px;}
    </style>
</head>
<body>

    <!-- Üst Gezinme Çubuğu -->
    <div class="navbar">
        <h2>Anketlerim</h2>
        <button class="btn-primary" onclick="openModal()">+ Yeni Anket Oluştur</button>
    </div>

    <!-- Anketlerin Listeleneceği Alan -->
    <div class="container">
        <div id="surveyGrid" class="survey-grid">
            <!-- JavaScript ile anketler buraya yüklenecek -->
        </div>
    </div>

    <!-- Yeni Anket Ekleme Formu (Modal) -->
    <div id="surveyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-top: 0; text-align: center;">Yeni Anket Ekle</h3>
            <form id="surveyForm">
                <label for="title">Anket Başlığı</label>
                <input type="text" id="title" required placeholder="Örn: Çalışan Memnuniyeti">

                <label for="description">Açıklama</label>
                <textarea id="description" rows="4" required placeholder="Anketin amacını kısaca yazın..."></textarea>

                <button type="submit" class="btn-submit">Kaydet</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // --- 1. SAYFA YÜKLENDİĞİNDE ANKETLERİ ÇEK ---
        document.addEventListener("DOMContentLoaded", fetchSurveys);

        async function fetchSurveys() {
            const grid = document.getElementById('surveyGrid');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/surveys`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include' 
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.replace('login.html');
                    return;
                }

                if (response.ok) {
                    const surveys = await response.json();
                    grid.innerHTML = ''; 

                    if (surveys.length === 0) {
                        grid.innerHTML = '<div class="empty-message">Henüz bir anket oluşturmadınız. Sağ üst köşeden yeni bir anket ekleyebilirsiniz.</div>';
                        return;
                    }

                    surveys.forEach(survey => {
                        const card = document.createElement('div');
                        card.className = 'survey-card';
                        card.innerHTML = `
                            <h3>${survey.title}</h3>
                            <p>${survey.description}</p>
                            <small style="color: #007bff; font-weight: bold;">Soruları yönetmek için tıkla &rarr;</small>
                        `;
                        
                        card.onclick = () => {
                            window.location.href = `detail.html?id=${survey.id}`;
                        };

                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="empty-message" style="color:red;">Anketler yüklenirken hata oluştu!</div>';
                }
            } catch (error) {
                console.error("Bağlantı hatası:", error);
            }
        }

        // --- 2. YENİ ANKET EKLEME İŞLEMİ ---
        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/surveys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title, description })
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.replace('login.html');
                    return;
                }

                if (response.status === 201) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'Anket başarıyla oluşturuldu!';
                    document.getElementById('surveyForm').reset();
                    
                    setTimeout(() => {
                        closeModal();
                        fetchSurveys(); 
                        messageDiv.textContent = '';
                    }, 1000);
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'Hata: Anket kaydedilemedi.';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Sunucu bağlantı hatası!';
            }
        });

        // --- 3. MODAL KONTROL FONKSİYONLARI ---
        function openModal() {
            document.getElementById('surveyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('surveyModal').style.display = 'none';
            document.getElementById('message').textContent = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('surveyModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
