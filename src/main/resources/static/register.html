<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anket Uygulaması - Kayıt Ol</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); width: 320px; }
        .register-card h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-size: 14px; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Kayıt Ol</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>
        <div id="message"></div>
        <div class="link">
            Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                // Lokal Backend'e (Bağıl URL) İstek Atılır
                const response = await fetch('/User/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role: "USER" })
                });

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = "Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...";
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = "Kayıt başarısız! Kullanıcı adı zaten alınmış olabilir.";
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = "Sunucuya bağlanılamadı.";
            }
        });
    </script>

</body>
</html>
